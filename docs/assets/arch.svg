<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12151d"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0355a"/>
      <stop offset="1" stop-color="#f04a6d"/>
    </linearGradient>
  </defs>

  <rect width="920" height="420" rx="14" fill="url(#bg)"/>

  <!-- Title -->
  <text x="32" y="42" fill="#f1f3f8" font-size="20" font-weight="700">系统架构</text>
  <text x="32" y="64" fill="#6b7690" font-size="13">本地优先 · 无云端依赖 · 数据全部存于 data/</text>

  <!-- Browser -->
  <g>
    <rect x="32" y="96" width="240" height="280" rx="12" fill="#181c26" stroke="#232936"/>
    <text x="52" y="124" fill="#b6bed0" font-size="14" font-weight="600">浏览器 / 客户端</text>
    <rect x="52" y="140" width="200" height="34" rx="8" fill="#202634"/>
    <text x="66" y="162" fill="#f1f3f8" font-size="12.5">Vue 3 + Vite 前端</text>
    <rect x="52" y="186" width="200" height="34" rx="8" fill="#202634"/>
    <text x="66" y="208" fill="#f1f3f8" font-size="12.5">画廊 / 详情 / 设置</text>
    <rect x="52" y="232" width="200" height="34" rx="8" fill="#202634"/>
    <text x="66" y="254" fill="#f1f3f8" font-size="12.5">语义搜索 · AI 面板</text>
    <rect x="52" y="278" width="200" height="34" rx="8" fill="#202634"/>
    <text x="66" y="300" fill="#f1f3f8" font-size="12.5">数据健康 · 统计</text>
    <rect x="52" y="324" width="200" height="34" rx="8" fill="url(#brand)"/>
    <text x="66" y="346" fill="#fff" font-size="12.5">静态资源 web_dist/</text>
  </g>

  <!-- Arrow API -->
  <g>
    <path d="M272 236 H 360" stroke="#4d8dff" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="286" y="226" fill="#4d8dff" font-size="11.5">REST /api</text>
  </g>

  <!-- Backend -->
  <g>
    <rect x="360" y="96" width="300" height="280" rx="12" fill="#181c26" stroke="#232936"/>
    <text x="380" y="124" fill="#b6bed0" font-size="14" font-weight="600">FastAPI 后端</text>
    <rect x="380" y="140" width="260" height="30" rx="7" fill="#202634"/>
    <text x="394" y="160" fill="#f1f3f8" font-size="12">api.py  ·  路由与任务</text>
    <rect x="380" y="178" width="260" height="30" rx="7" fill="#202634"/>
    <text x="394" y="198" fill="#f1f3f8" font-size="12">store.py  ·  数据访问层</text>
    <rect x="380" y="216" width="260" height="30" rx="7" fill="#202634"/>
    <text x="394" y="236" fill="#f1f3f8" font-size="12">parser.py  ·  番号解析</text>
    <rect x="380" y="254" width="260" height="30" rx="7" fill="#202634"/>
    <text x="394" y="274" fill="#f1f3f8" font-size="12">scanner/scraper  ·  扫描刮削</text>
    <rect x="380" y="292" width="260" height="30" rx="7" fill="#202634"/>
    <text x="394" y="312" fill="#f1f3f8" font-size="12">providers/  ·  可插拔数据源</text>
    <rect x="380" y="330" width="260" height="30" rx="7" fill="url(#brand)" opacity="0.92"/>
    <text x="394" y="350" fill="#fff" font-size="12">ai.py  ·  兼容 OpenAI 协议</text>
  </g>

  <!-- Arrow DB -->
  <g>
    <path d="M660 236 H 720" stroke="#2fb87a" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Storage -->
  <g>
    <rect x="720" y="96" width="168" height="280" rx="12" fill="#181c26" stroke="#232936"/>
    <text x="740" y="124" fill="#b6bed0" font-size="14" font-weight="600">本地存储</text>
    <rect x="740" y="140" width="128" height="34" rx="8" fill="#202634"/>
    <text x="754" y="162" fill="#f1f3f8" font-size="12">SQLite</text>
    <rect x="740" y="186" width="128" height="34" rx="8" fill="#202634"/>
    <text x="754" y="208" fill="#f1f3f8" font-size="12">covers/</text>
    <rect x="740" y="232" width="128" height="34" rx="8" fill="#202634"/>
    <text x="754" y="254" fill="#f1f3f8" font-size="12">avatars/</text>
    <rect x="740" y="278" width="128" height="34" rx="8" fill="#202634"/>
    <text x="754" y="300" fill="#f1f3f8" font-size="12">config.json</text>
    <rect x="740" y="324" width="128" height="34" rx="8" fill="#202634"/>
    <text x="754" y="346" fill="#f1f3f8" font-size="12">磁盘媒体文件</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#4d8dff"/>
    </marker>
  </defs>

  <text x="32" y="404" fill="#6b7690" font-size="11.5">数据源（javbus/javdb/本地 nfo/自定义 JSON·HTML）与 AI 端点均为可选、用户自配置的外部服务，默认不联网。</text>
</svg>
