<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="920" height="300" rx="14" fill="#0b0d12"/>
  <text x="32" y="40" fill="#f1f3f8" font-size="20" font-weight="700">双主题界面</text>
  <text x="32" y="62" fill="#6b7690" font-size="13">原生表单控件随 color-scheme 正确渲染，暗色下文字清晰可读</text>

  <!-- Dark panel -->
  <g transform="translate(32,84)">
    <rect width="420" height="180" rx="12" fill="#161a25" stroke="#232936"/>
    <rect x="16" y="16" width="120" height="120" rx="8" fill="#202634"/>
    <text x="156" y="40" fill="#f1f3f8" font-size="14" font-weight="600">作品标题示例</text>
    <text x="156" y="62" fill="#6b7690" font-size="11.5">类型 · 女优 · 时长 120min</text>
    <rect x="156" y="78" width="240" height="22" rx="6" fill="#202634"/>
    <rect x="156" y="108" width="180" height="22" rx="6" fill="#202634"/>
    <rect x="156" y="140" width="120" height="30" rx="8" fill="#e0355a"/>
    <text x="176" y="160" fill="#fff" font-size="12">▶ 播放</text>
    <text x="16" y="166" fill="#4d8dff" font-size="11">DARK</text>
  </g>

  <!-- Light panel -->
  <g transform="translate(468,84)">
    <rect width="420" height="180" rx="12" fill="#f4f6fb" stroke="#d7dce8"/>
    <rect x="16" y="16" width="120" height="120" rx="8" fill="#e7ebf4"/>
    <text x="156" y="40" fill="#1a1f2b" font-size="14" font-weight="600">作品标题示例</text>
    <text x="156" y="62" fill="#5b667c" font-size="11.5">类型 · 女优 · 时长 120min</text>
    <rect x="156" y="78" width="240" height="22" rx="6" fill="#e7ebf4"/>
    <rect x="156" y="108" width="180" height="22" rx="6" fill="#e7ebf4"/>
    <rect x="156" y="140" width="120" height="30" rx="8" fill="#e0355a"/>
    <text x="176" y="160" fill="#fff" font-size="12">▶ 播放</text>
    <text x="16" y="166" fill="#4d8dff" font-size="11" font-weight="700">LIGHT</text>
  </g>
</svg>
