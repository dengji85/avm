# 片匣（AVM）容器编排示例
#
#   docker compose up -d --build
#
# 首次访问需要访问令牌：查看容器日志 `docker compose logs avm` 里的
# 「远程访问令牌」，或用下面的 AVM_ACCESS_TOKEN 预设一个固定值。
services:
  avm:
    # 默认使用 GitHub Actions 自动构建的多架构镜像（NAS 免编译，推荐）
    #   docker compose pull && docker compose up -d
    # 如需本地构建：注释掉下面的 image，取消 build 段注释
    image: ghcr.io/dengji85/avm:latest
    # 要在 NAS 上跑「语音对白提取」（Whisper）？改用全量插件版镜像（仅 x86_64，+约170MB）：
    #   image: ghcr.io/dengji85/avm:latest-full
    # 模型不随镜像（约 460MB），放到挂载卷里即可：
    #   volumes: - ./models:/data/models   ← 里面放 faster-whisper-small/
    # 详见 docs/Docker部署.md「语音对白提取」一节
    # build:
    #   context: .
    #   args:
    #     # 1=内置 chromium（av-wiki 的 CDP 抓取可用，镜像更大）
    #     # 0=精简，不含 chromium（其余数据源不受影响）
    #     INSTALL_CHROMIUM: "1"
    #     # 1=内置语音对白提取（+约 170MB 依赖；仅 x86_64 可用）
    #     # 模型不随镜像，放到挂载的 /data/models/faster-whisper-small
    #     WITH_ASR: "0"
    container_name: avm
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 与宿主机文件属主对齐（NAS 上常见 1000，群晖常见实际用户 UID）
      PUID: "1000"
      PGID: "1000"
      AVM_DATA_DIR: /data
      # 可选：预设访问令牌，避免每次从日志里找
      # AVM_ACCESS_TOKEN: "change-me-please"
      # 可选：对外访问地址。容器内只能看到容器网段地址，填了「设置 → 访问」
      # 才会显示手机能连上的地址（二维码内容是一次性短链，不含长期令牌）
      # AVM_PUBLIC_URL: "http://192.168.1.10:8770"
      # 刮削 / 下载需要走代理时，在这里声明（容器不会继承宿主机的代理环境变量）：
      # HTTP_PROXY: "http://192.168.1.2:7890"
      # HTTPS_PROXY: "http://192.168.1.2:7890"
      # NO_PROXY: "localhost,127.0.0.1"
    ports:
      - "8770:8770"
    volumes:
      # 配置 / 数据库 / 封面 / 头像 / 预览图（务必持久化）
      - ./data:/data
      # 媒体库：路径按你的实际目录修改；建议只读挂载
      - /path/to/your/media:/media:ro
    # Chromium 依赖较大的 /dev/shm，给小了容易崩
    shm_size: "256m"
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8770/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
