name: Docker Image

# 触发：
#  - 推 v* 标签：产出 1.13.0 / 1.13 / latest 等多标签镜像
#  - 推 main   ：产出 edge 与 latest（便于随时拉最新）
#  - 手动触发 ：Actions 页面点 Run workflow
on:
  push:
    tags: ["v*"]
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # arm64 需要 QEMU 仿真
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # latest 只在正式打 v* 标签时指向该版本，避免被 main 的临时构建覆盖
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INSTALL_CHROMIUM=1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------- 全量插件版
  # 与默认镜像的区别：内置语音对白提取依赖（faster-whisper，+约 170MB）。
  # 模型（约 460MB）不进镜像，仍放挂载的 /data/models/faster-whisper-small。
  # 仅 linux/amd64：ctranslate2 在 arm64 上无稳定 wheel，ARM NAS 跑 Whisper 也偏慢。
  full:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},suffix=-full
            type=semver,pattern={{major}}.{{minor}},suffix=-full
            type=raw,value=latest-full,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch,suffix=-full

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INSTALL_CHROMIUM=1
            WITH_ASR=1
          cache-from: type=gha,scope=full
          cache-to: type=gha,mode=max,scope=full
