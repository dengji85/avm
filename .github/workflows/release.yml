name: Release (Windows exe)

# 打 v* 标签时自动：构建前端 → PyInstaller 打包单文件 exe → 生成 SHA256 →
# 创建 / 更新 GitHub Release 并附加产物。
# 与 docker.yml 并行执行、互不依赖（一条 tag 同时产出 exe 与多架构镜像）。
on:
  push:
    tags: ["v*"]
  # 手动触发：只构建并产出 Actions 工件（不创建 Release），便于零打扰验证打包链路
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    env:
      # Windows 控制台默认非 UTF-8（可能是 cp1252），构建脚本含中文输出，强制 UTF-8 模式
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web_src/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # build.py 只是打包，需要先把前端产物构建到仓库根的 web_dist/
      - name: Build frontend
        working-directory: web_src
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build single-file exe
        run: python build.py

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          Get-ChildItem dist\AVM-*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii dist\SHA256.txt
          Get-Content dist\SHA256.txt

      # 手动触发时仅上传为 Actions 工件，不碰 Release（避免为验证制造无意义的发布）
      - name: Upload artifact (manual run only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: AVM-windows-exe
          path: |
            dist/AVM-*.exe
            dist/SHA256.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/AVM-*.exe
            dist/SHA256.txt
          fail_on_unmatched_files: true
