name: Release (Windows exe)

# 打 v* 标签时自动：构建前端 → PyInstaller 打包单文件 exe → 创建 / 更新 GitHub
# Release 并附加产物（SHA256 由 GitHub 资产详情页自带，不再单独产出校验文件）。
# 产物含 exe 与浏览器用户脚本 avm-companion-<插件版本>.user.js（插件版本独立于主程序，
# 由 build.py 从 UserScript 头的 @version 取，见 docs/浏览器插件与在线资源设计.md）。
# 同时重打 asr-libs / opencv-libs 组件 zip 并更新到 ext-bundle 固定 tag 的
# Release（组件资产与应用发版解耦，见 docs/扩展组件手册.md）。
# 与 docker.yml 并行执行、互不依赖（一条 tag 同时产出 exe 与多架构镜像）。
on:
  push:
    tags: ["v*"]
  # 手动触发：只构建并产出 Actions 工件（不创建 Release），便于零打扰验证打包链路
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    env:
      # Windows 控制台默认非 UTF-8（可能是 cp1252），构建脚本含中文输出，强制 UTF-8 模式
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web_src/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # build.py 只是打包，需要先把前端产物构建到仓库根的 web_dist/
      - name: Build frontend
        working-directory: web_src
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build single-file exe
        run: python build.py

      # 手动触发时仅上传为 Actions 工件，不碰 Release（避免为验证制造无意义的发布）
      - name: Upload artifact (manual run only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: AVM-windows-exe
          path: |
            dist/AVM-*.exe
            dist/avm-companion-*.user.js

      # 发布说明从 CHANGELOG.md 自动抽取对应版本段，避免手改 RELEASE_NOTES.md 导致发出旧版内容
      - name: Generate release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python - <<'PY'
          import re, sys
          tag = "${{ github.ref_name }}"
          ver = tag[1:] if tag.startswith("v") else tag
          text = open("CHANGELOG.md", encoding="utf-8").read()
          pat = re.compile(r'^##\s*\[v?' + re.escape(ver) + r'\b', re.M)
          m = pat.search(text)
          if not m:
              sys.exit("version header not found for " + tag)
          rest = text[m.end():]
          nxt = re.search(r'\n##\s', rest)
          end = m.end() + (nxt.start() if nxt else len(rest))
          section = text[m.start():end].strip() + "\n"
          section = re.sub(r'^##\s*\[[^\]]+\][^\n]*\n', '', section, count=1).strip() + "\n"
          open("RELEASE_NOTES.md", "w", encoding="utf-8").write(section)
          print("generated RELEASE_NOTES.md for", tag)
          PY

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/AVM-*.exe
            dist/avm-companion-*.user.js
          fail_on_unmatched_files: true

  # 语音识别依赖的预打包 zip：便携版 exe 里没有 pip，「一键安装」下载的就是它。
  # 组件资产统一托管在 ext-bundle 固定 tag 的 Release（与应用发版解耦），
  # 打 v* 标签时重打并 --clobber 覆盖同名资产，应用端无需任何改动。
  asr-libs-zip:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build asr-libs zip
        run: python tools/build_asr_zip.py --out dist

      - name: Upload artifact (manual run only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: asr-libs-zip
          path: |
            dist/asr-libs-*.zip

      - name: Publish to ext-bundle release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ext-bundle (Get-ChildItem dist\asr-libs-*.zip).FullName --clobber

  # 人脸定位运行库（opencv + numpy）：竖版海报智能裁切用，同 ext-bundle 固定 tag 托管。
  opencv-libs-zip:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build opencv-libs zip
        run: python tools/build_opencv_zip.py --out dist

      - name: Upload artifact (manual run only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: opencv-libs-zip
          path: |
            dist/opencv-libs-*.zip

      - name: Publish to ext-bundle release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ext-bundle (Get-ChildItem dist\opencv-libs-*.zip).FullName --clobber
