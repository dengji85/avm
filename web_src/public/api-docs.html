<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>片匣 · API 文档</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161922; --line: #262b36; --text: #e6e8ee;
    --muted: #8b93a7; --accent: #5b8cff;
    --get: #3ba55d; --post: #4b7bec; --put: #c08a2e; --del: #d64545; --patch: #8e6bd8;
    font-synthesis: none;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  .top {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px;
    padding: 10px 18px; background: rgba(15,17,21,.92); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 700; letter-spacing: .3px; }
  .brand span { color: var(--accent); }
  .meta { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  .search {
    width: 260px; max-width: 40vw; padding: 6px 10px; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .btn, .btn:visited {
    color: var(--text); text-decoration: none; font-size: 12px; padding: 6px 10px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  main { max-width: 1080px; margin: 0 auto; padding: 18px; }
  h2 {
    margin: 22px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); font-weight: 600;
  }
  details.op { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin: 6px 0; }
  details.op > summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; font-size: 13px;
  }
  details.op > summary::-webkit-details-marker { display: none; }
  details.op[open] > summary { border-bottom: 1px solid var(--line); }
  .m {
    flex: 0 0 62px; text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .04em;
    padding: 2px 0; border-radius: 6px; color: #fff;
  }
  .m.get { background: var(--get); } .m.post { background: var(--post); }
  .m.put { background: var(--put); } .m.patch { background: var(--patch); }
  .m.delete { background: var(--del); }
  .path { font-family: ui-monospace, Consolas, monospace; }
  .sum { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .body { padding: 10px 14px 14px; }
  .sec-title { color: var(--muted); font-size: 12px; margin: 12px 0 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  .req { color: var(--del); font-size: 11px; }
  pre.curl {
    margin: 8px 0 0; padding: 8px 10px; background: #0b0d11; border: 1px solid var(--line);
    border-radius: 8px; overflow-x: auto; font-size: 12px; white-space: pre-wrap; word-break: break-all;
  }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .err { color: #ff8a8a; }
  .resp { margin-top: 8px; }
  .hint { color: var(--muted); font-size: 12px; }
  .foot { max-width: 1080px; margin: 30px auto 40px; padding: 0 18px; color: var(--muted); font-size: 12px; }
  input.q { width: 130px; padding: 4px 7px; color: var(--text); background: #0b0d11; border: 1px solid var(--line); border-radius: 6px; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">片匣 <span>API</span></div>
  <div class="meta" id="meta">加载中…</div>
  <div class="spacer"></div>
  <input id="q" class="search" placeholder="搜索路径 / 说明，如 movies" />
  <a class="btn" id="spec" href="/api/openapi.json" target="_blank" rel="noopener">OpenAPI JSON</a>
</header>

<main id="list"><div class="empty">正在读取接口定义…</div></main>

<footer class="foot">
  文档由程序自带、不依赖任何外网资源；接口按标签分组，点任意一行展开参数。GET 接口可直接在本页发送请求。
</footer>

<script src="/api-docs.js" defer></script>
</body>
</html>
